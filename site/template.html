<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{doc_title}}</title>
  <script>
    // Apply a saved theme before the first paint so the page never flashes the wrong one.
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
  <link rel="stylesheet" href="{{base}}assets/style.css?v={{v}}">
  <script src="{{base}}assets/ui.js?v={{v}}" defer></script>
  <script src="{{base}}assets/say.js?v={{v}}" defer></script>
  {{component_scripts}}
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="wordmark" href="{{base}}index.html">{{site_name}}</a>
    <span class="topbar-tag">Southern</span>
    <button type="button" class="icon-btn theme-toggle" aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Chapters">{{sidebar}}</nav>
    <div class="nav-backdrop" hidden></div>
    <main class="main">
      <header class="page-head">
        {{eyebrow}}
        <h1>{{title}}</h1>
      </header>
      <article class="prose">
{{content}}
      </article>
      <nav class="pager" aria-label="Chapter navigation">{{pager}}</nav>
    </main>
  </div>
</body>
</html>
